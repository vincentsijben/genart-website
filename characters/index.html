<title>Character Designs</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --muted:#86868b; --line:#e4e2dd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1f1f1f; --ink:#f2f2f2; --muted:#8e8e93; --line:#2e2e2e; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,sans-serif; padding:48px 24px 80px; }
  header, section { max-width:1400px; margin:0 auto; }
  header { display:flex; flex-wrap:wrap; gap:16px; align-items:end; justify-content:space-between; margin-bottom:40px; }
  h1 { font-size:clamp(28px,4vw,44px); letter-spacing:-.02em; }
  header p { color:var(--muted); margin-top:4px; }
  input { font:inherit; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); width:240px; }
  section { margin-bottom:56px; }
  h2 { font-size:20px; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  h2 span { color:var(--muted); font-weight:400; font-size:15px; margin-left:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; }
  figure { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  figure[hidden] { display:none; }
  figure button { all:unset; display:block; width:100%; aspect-ratio:1; cursor:zoom-in; background:#fff; }
  figure img { width:100%; height:100%; object-fit:contain; display:block; transition:transform .2s; }
  figure button:hover img { transform:scale(1.04); }
  figcaption { display:flex; justify-content:space-between; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
  figcaption span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  figcaption small { color:var(--muted); }
  dialog { border:0; padding:0; margin:auto; inset:0; background:transparent; max-width:90vw; max-height:90vh; overflow:visible; }
  dialog img { margin:0 auto; }
  dialog::backdrop { background:rgba(0,0,0,.85); }
  dialog img { max-width:90vw; max-height:85vh; display:block; background:#fff; border-radius:8px; }
  dialog p { color:#fff; text-align:center; margin-top:10px; }
  @media (max-width:500px) { body { padding:32px 16px; } .grid { grid-template-columns:repeat(2,1fr); gap:10px; } input { width:100%; } }
</style>
</head>

<script>
  const dlg = document.querySelector("dialog"), big = dlg.querySelector("img"), cap = dlg.querySelector("p");
  document.querySelectorAll("figure button").forEach(b => b.onclick = () => {
    const img = b.querySelector("img"); big.src = img.src; big.alt = img.alt;
    cap.textContent = b.parentElement.querySelector("figcaption").textContent.replace(/(CMD1\w)$/, " · $1");
    dlg.showModal();
  });
  dlg.onclick = () => dlg.close();
  document.querySelector("input").oninput = e => {
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll("figure").forEach(f => f.hidden = q && !f.dataset.name.includes(q));
    document.querySelectorAll("section").forEach(s => s.hidden = !s.querySelector("figure:not([hidden])"));
  };
</script>
